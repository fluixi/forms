name: Release

# Runs on push to main (stable) and next (prerelease).
# - Pending changesets        → opens/updates a "Version Packages" PR
# - "Version Packages" merged → builds & publishes to public npm
# On `next`, changesets is in pre mode (.changeset/pre.json, tag `next`) → versions are
# `-next.X`, published under the `next` dist-tag, separate from `latest` on main.
on:
  push:
    branches: [main, next, alpha]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write   # npm publish provenance (OIDC) — enable once the repo is public
  pull-requests: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      # `secrets.X || secrets.Y` falls back only when X is empty, so an expired PAT is
      # still chosen and checkout fails on `could not read Username`. Ask the API instead.
      - name: Check the release token
        id: token
        run: |
          if [ -n "${{ secrets.PACKAGES_TOKEN }}" ] && curl -sf -o /dev/null \
              -H "Authorization: Bearer ${{ secrets.PACKAGES_TOKEN }}" \
              https://api.github.com/user; then
            echo "pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "pat=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=PACKAGES_TOKEN unusable::Falling back to GITHUB_TOKEN. Rotate the PAT."
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.pat == 'true' && secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # No registry-url — it writes a temp .npmrc that would shadow ~/.npmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # @fluixi framework deps are read from public npm — no auth for install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm v10 ignores committed .npmrc tokens; write the publish token to ~/.npmrc.
      - name: Configure registry auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 1. changesets present → "Version Packages" PR. 2. that PR merged → `pnpm release`.
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.pat == 'true' && secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance: enable ONLY after the repo is public (hard-fails on private).
          # NPM_CONFIG_PROVENANCE: true
