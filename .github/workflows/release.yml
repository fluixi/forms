name: Release

# Pending changesets open or update a "Version Packages" PR; merging it publishes to npm.
# On alpha, changesets is in pre mode (.changeset/pre.json), so versions are `-alpha.X`
# under the `alpha` dist-tag.
on:
  push:
    branches: [main, next, alpha]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  # npm trusted publishing: the job trades this token for a short-lived publish credential.
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No NPM_TOKEN anywhere in this job: npm uses a token when it finds one and never
      # tries trusted publishing.
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
